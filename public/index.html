<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RED Winter</title>
  <meta name="description" content="Cyberpunk RED Living Community" />
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090909; color: #f5f5f5; }
    main { width: min(92vw, 720px); text-align: center; padding: 48px 24px; }
    .badge { width: 120px; height: 120px; margin: 0 auto 24px; border: 2px solid #ef4444; border-radius: 24px; display: grid; place-items: center; font-weight: 900; font-size: 28px; letter-spacing: .08em; color: #ef4444; }
    h1 { margin: 0 0 8px; font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: -.04em; }
    .subtitle { margin: 0 0 28px; color: #d1d5db; font-size: 1.1rem; }
    .label { margin: 0 0 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: #ef4444; font-size: .82rem; }
    .lede { margin: 0 auto 28px; max-width: 520px; color: #e5e7eb; font-size: 1.15rem; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 30px; }
    a.button, button { appearance: none; border: 1px solid #333; background: #171717; color: #fff; text-decoration: none; padding: 12px 18px; border-radius: 10px; font: inherit; cursor: pointer; }
    a.button.primary { background: #ef4444; border-color: #ef4444; color: #111; font-weight: 800; }
    a.button:hover, button:hover { border-color: #ef4444; }
    button:disabled { opacity: .55; cursor: wait; }
    .api { border-top: 1px solid #262626; padding-top: 24px; }
    #api-result { min-height: 1.5em; margin-top: 10px; color: #9ca3af; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9rem; word-break: break-word; }
    footer { margin-top: 32px; color: #737373; font-size: .9rem; }
    footer a { color: #a3a3a3; }
  </style>
</head>
<body>
  <main>
    <div class="badge" aria-label="RED Winter badge">RED</div>
    <h1>RED Winter</h1>
    <p class="subtitle">Cyberpunk RED Living Community</p>

    <p class="label">TTRPG Community</p>
    <p class="lede">Come play cyberpunk with strangers</p>

    <div class="actions">
      <a class="button primary" href="https://discord.gg/" target="_blank" rel="noreferrer">Join Discord</a>
      <a class="button" href="https://redash.redwinter.online" target="_blank" rel="noreferrer">REDash Character Roller</a>
    </div>

    <section class="api" aria-labelledby="api-heading">
      <p class="label" id="api-heading">Demo API</p>
      <button id="api-button" type="button">Call Worker API</button>
      <div id="api-result" role="status" aria-live="polite">Ready.</div>
    </section>

    <footer><a href="https://github.com/Ryan-CS" target="_blank" rel="noreferrer">GitHub</a></footer>
  </main>

  <script>
    const API_BASE = "https://redwinter-online-test.ryan-skogstad.workers.dev";
    const button = document.getElementById("api-button");
    const result = document.getElementById("api-result");

    button.addEventListener("click", async () => {
      button.disabled = true;
      result.textContent = "Calling Worker API…";

      try {
        const response = await fetch(`${API_BASE}/api/demo`, {
          headers: { Accept: "application/json" },
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        result.textContent = JSON.stringify(data);
      } catch (error) {
        result.textContent = `Demo API unavailable: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
